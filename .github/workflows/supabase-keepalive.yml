name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días 6:00 AM UTC (2:00 AM Venezuela)
  workflow_dispatch:        # permite correrlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -X GET "https://yoanpzeigqtfvtotkbpe.supabase.co/rest/v1/platform_config?select=key&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
